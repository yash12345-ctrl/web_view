name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare Release APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "srm-mobile-portal-v${{ steps.version.outputs.name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: srm-mobile-portal-v${{ steps.version.outputs.name }}
          path: srm-mobile-portal-v${{ steps.version.outputs.name }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: SRM Mobile Portal v${{ steps.version.outputs.name }}
          body: |
            Automated build of **SRM Mobile Portal v${{ steps.version.outputs.name }}**.

            Tap **Update Now** inside the app or download the attached `.apk` directly.
          files: srm-mobile-portal-v${{ steps.version.outputs.name }}.apk
          make_latest: true
