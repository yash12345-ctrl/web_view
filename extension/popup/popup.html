<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Better SRM Portal</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <div class="header">
      <img src="../icons/icon-48.png" alt="SRM Mobile" class="logo" />
      <div>
        <h1>Better SRM Portal</h1>
        <p class="subtitle">Mobile Responsive UI v1.1.3</p>
      </div>
    </div>

    <label class="toggle-row">
      <span>Enable Mobile UI</span>
      <input type="checkbox" id="toggleEnabled" checked />
    </label>

    <a
      class="open-btn"
      href="https://sp.srmist.edu.in/srmiststudentportal/students/loginManager/youLogin.jsp"
      target="_blank"
      rel="noopener noreferrer"
    >
      Open SRM Student Portal
    </a>

    <p class="note">
      Runs locally in your browser on <strong>sp.srmist.edu.in</strong> only. Never collects credentials or data.
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
